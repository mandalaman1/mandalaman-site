name: Mettre a jour la galerie

on:
  push:
    paths:
      - 'galerie/oeuvres/**'
      - 'scripts/build_gallery.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Construire le catalogue
        run: python scripts/build_gallery.py
      - name: Enregistrer le catalogue genere
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add galerie/oeuvres.json
          git diff --cached --quiet || git commit -m "Mettre a jour la galerie"
          git push
