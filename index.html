<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Galerie / Vente | Mandalaman</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  background:#070706;
  color:#eee4c9;
  font-family:Georgia,"Times New Roman",serif;
}

header{
  min-height:56px;
  padding:14px 3vw;
  border-bottom:1px solid rgba(183,141,56,.45);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:24px;
  background:rgba(7,7,6,.96);
}

.brand{
  color:#f0d274;
  font-size:20px;
  white-space:nowrap;
}

.brand i{
  font-weight:normal;
}

nav{
  display:flex;
  gap:24px;
  align-items:center;
  flex-wrap:wrap;
  justify-content:flex-end;
}

nav a{
  color:#eee4c9;
  text-decoration:none;
  font-size:12px;
}

nav a.active{
  color:#f0d274;
  border-bottom:1px solid #bd9037;
  padding-bottom:5px;
}

.intro{
  width:92%;
  max-width:1180px;
  margin:52px auto 34px;
  text-align:center;
}

.intro small{
  color:#d5a641;
  letter-spacing:.28em;
}

.intro h1{
  color:#f5e5b4;
  font-size:46px;
  font-weight:400;
  margin:10px 0 4px;
}

.gallery{
  width:min(1180px,92vw);
  margin:35px auto 80px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
}

.card{
  display:block;
  color:inherit;
  text-decoration:none;
  border:1px solid rgba(160,120,40,.5);
  background:rgba(10,9,6,.94);
  transition:transform .18s ease,border-color .18s ease;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#c99a3c;
}

.card-photo{
  height:390px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#020202;
}

.card-photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.card-body{
  padding:18px;
}

.card h2{
  color:#f1dfad;
  font-size:24px;
  font-weight:400;
  margin:0 0 10px;
}

.meta{
  margin:0;
  font:13px Arial,sans-serif;
  color:#aaa18e;
}

.technique{
  margin:12px 0 0;
  font:12px/1.45 Arial,sans-serif;
  color:#a69d88;
}

.card-bottom{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:15px;
  margin-top:18px;
}

.price{
  color:#e5bd59;
  font-size:22px;
}

.status{
  color:#bca66d;
  font:9px Arial,sans-serif;
  letter-spacing:.12em;
}

.detail{
  width:min(1180px,92vw);
  margin:42px auto 80px;
}

.detail-back{
  display:inline-block;
  margin-bottom:25px;
  color:#d9b456;
  text-decoration:none;
  font:12px Arial,sans-serif;
}

.detail-layout{
  display:grid;
  grid-template-columns:minmax(0,1.6fr) minmax(280px,.8fr);
  gap:42px;
  align-items:start;
}

.detail-main{
  border:1px solid rgba(160,120,40,.5);
  background:#030303;
  padding:14px;
}

.detail-main img{
  display:block;
  width:100%;
  max-height:76vh;
  object-fit:contain;
}

.detail-info{
  border-top:1px solid rgba(197,151,57,.65);
  padding-top:20px;
}

.detail-info small{
  color:#d5a641;
  letter-spacing:.22em;
}

.detail-info h1{
  color:#f3dfaa;
  font-size:42px;
  font-weight:400;
  line-height:1.05;
  margin:10px 0 24px;
}

.detail-info p{
  color:#c1b8a3;
  font:14px/1.55 Arial,sans-serif;
}

.detail-price{
  color:#e5bd59;
  font-size:28px;
  margin:28px 0 8px;
}

.detail-status{
  display:inline-block;
  color:#d7b45a;
  border:1px solid #9e7429;
  padding:10px 14px;
  font:11px Arial,sans-serif;
  letter-spacing:.12em;
}

.description{
  margin-top:26px;
}

.detail-photos{
  margin-top:36px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.detail-photos img{
  width:100%;
  height:230px;
  object-fit:cover;
  border:1px solid rgba(160,120,40,.45);
  cursor:zoom-in;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:80px 20px;
  color:#918a79;
  font:14px Arial,sans-serif;
}

@media(max-width:900px){
  header{
    flex-direction:column;
    align-items:flex-start;
  }

  nav{
    justify-content:flex-start;
  }

  .gallery{
    grid-template-columns:repeat(2,1fr);
  }

  .detail-layout{
    grid-template-columns:1fr;
  }
}

@media(max-width:580px){
  .gallery{
    grid-template-columns:1fr;
  }

  .card-photo{
    height:65vh;
    max-height:480px;
  }

  .intro h1{
    font-size:38px;
  }

  .detail-info h1{
    font-size:36px;
  }

  .detail-photos{
    grid-template-columns:1fr;
  }

  .detail-photos img{
    height:auto;
  }
}

/* ===== CADRE MANDALAMAN VALIDÉ ===== */
body{
  position:relative;
  background:
    linear-gradient(rgba(4,5,3,.42),rgba(4,5,3,.58)),
    #070706;
}
body::before,
body::after{
  content:"";
  position:fixed;
  pointer-events:none;
  z-index:9000;
}
body::before{
  inset:10px;
  border:1px solid rgba(216,179,88,.86);
}
body::after{
  inset:17px;
  border:1px solid rgba(216,179,88,.30);
}
.mandala-frame-piece{
  position:fixed;
  z-index:9001;
  pointer-events:none;
  background-repeat:no-repeat;
  background-position:center;
  background-size:contain;
}
.mandala-corner{
  width:58px;
  height:58px;
  background-image:url("images/decor/corner.png");
}
.mandala-tl{left:9px;top:9px}
.mandala-tr{right:9px;top:9px;transform:scaleX(-1)}
.mandala-bl{left:9px;bottom:9px;transform:scaleY(-1)}
.mandala-br{right:9px;bottom:9px;transform:scale(-1)}

.mandala-separator{
  background-image:url("images/decor/separator.png");
}
.mandala-sep-top,
.mandala-sep-bottom{
  left:50%;
  width:150px;
  height:34px;
}
.mandala-sep-top{top:-6px;transform:translateX(-50%)}
.mandala-sep-bottom{bottom:-6px;transform:translateX(-50%) scaleY(-1)}
.mandala-sep-left,
.mandala-sep-right{
  top:50%;
  width:34px;
  height:150px;
}
.mandala-sep-left{left:-6px;transform:translateY(-50%) rotate(90deg)}
.mandala-sep-right{right:-6px;transform:translateY(-50%) rotate(-90deg)}

header{
  margin:18px 28px 0;
  background:rgba(7,7,6,.72);
}
.intro{
  text-align:left;
  padding:30px 34px;
  background:rgba(4,7,4,.88);
  border:1px solid rgba(216,179,88,.35);
  border-left-color:rgba(216,179,88,.78);
}
.gallery{
  padding:20px;
  background:rgba(3,6,3,.88);
  border:1px solid rgba(216,179,88,.42);
}
.detail{
  padding:20px;
  background:rgba(3,6,3,.82);
  border:1px solid rgba(216,179,88,.34);
}
@media(max-width:580px){
  .mandala-corner{width:42px;height:42px}
  .mandala-sep-top,.mandala-sep-bottom{width:105px;height:28px}
  .mandala-sep-left,.mandala-sep-right{width:28px;height:105px}
  header{margin:12px 18px 0}
}

</style>
</head>

<body>

<div class="mandala-frame-piece mandala-corner mandala-tl"></div>
<div class="mandala-frame-piece mandala-corner mandala-tr"></div>
<div class="mandala-frame-piece mandala-corner mandala-bl"></div>
<div class="mandala-frame-piece mandala-corner mandala-br"></div>
<div class="mandala-frame-piece mandala-separator mandala-sep-top"></div>
<div class="mandala-frame-piece mandala-separator mandala-sep-bottom"></div>
<div class="mandala-frame-piece mandala-separator mandala-sep-left"></div>
<div class="mandala-frame-piece mandala-separator mandala-sep-right"></div>


<header>
  <div class="brand">✦ PATRICK DUVAL <i>Mandalaman</i></div>

  <nav>
    <a href="#">ACCUEIL</a>
    <a href="#">CHRONOBIO</a>
    <a href="#">CONTACT</a>
    <a href="#">VIDÉOS</a>
    <a href="index.html" class="active">GALERIE/VENTE</a>
    <a href="#">ARTICLES ET VISIONS</a>
    <a href="#">LIVRE D'OR</a>
  </nav>
</header>

<div id="app">
  <div class="empty">Chargement des œuvres…</div>
</div>

<script>
const app = document.getElementById("app");

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[character]));
}

function slug(text){
  return String(text ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");
}

function renderGallery(list){
  app.innerHTML = `
    <section class="intro">
      <small>ŒUVRES</small>
      <h1>Galerie / Vente</h1>
    </section>

    <main class="gallery">
      ${list.length ? list.map(o => `
        <a
          class="card"
          href="?oeuvre=${encodeURIComponent(slug(o.titre))}"
          target="_blank"
          rel="noopener"
        >
          <div class="card-photo">
            ${o.photo_principale
              ? `<img src="${esc(o.photo_principale)}" alt="${esc(o.titre)}">`
              : ""}
          </div>

          <div class="card-body">
            <h2>${esc(o.titre || "Sans titre")}</h2>

            <p class="meta">
              ${esc(o.dimensions || "")}
              ${o.annee ? " · " + esc(o.annee) : ""}
            </p>

            ${o.technique
              ? `<p class="technique">${esc(o.technique)}</p>`
              : ""}

            <div class="card-bottom">
              <span class="price">${esc(o.prix || "")}</span>
              <span class="status">
                ${o.vendu ? "VENDU" : "DISPONIBLE"}
              </span>
            </div>
          </div>
        </a>
      `).join("") : `
        <div class="empty">Aucune œuvre publiée.</div>
      `}
    </main>
  `;
}

function renderDetail(o){
  const details = Array.isArray(o.photos_details)
    ? o.photos_details
    : [];

  app.innerHTML = `
    <main class="detail">

      <a class="detail-back" href="index.html">
        ← RETOUR À LA GALERIE
      </a>

      <div class="detail-layout">

        <div>
          <div class="detail-main">
            ${o.photo_principale
            ? `<img src="${esc(o.photo_principale)}" alt="${esc(o.titre)}" onclick="ouvrirLightbox(this.src)" style="cursor:zoom-in">`
              : ""}
          </div>

          ${details.length ? `
            <div class="detail-photos">
              ${details.map(photo => `
                <img
                  src="${esc(photo)}"
                  alt="Détail de ${esc(o.titre)}"
                 onclick="ouvrirLightbox(this.src)"
                >
              `).join("")}
            </div>
          ` : ""}
        </div>

        <aside class="detail-info">
          <small>ŒUVRE</small>

          <h1>${esc(o.titre || "Sans titre")}</h1>

          ${o.technique
            ? `<p><strong>Technique :</strong><br>${esc(o.technique)}</p>`
            : ""}

          ${o.dimensions
            ? `<p><strong>Dimensions :</strong><br>${esc(o.dimensions)}</p>`
            : ""}

          ${o.annee
            ? `<p><strong>Année :</strong><br>${esc(o.annee)}</p>`
            : ""}

          <div class="detail-price">${esc(o.prix || "")}</div>

          <div class="detail-status">
            ${o.vendu ? "VENDU" : "DISPONIBLE"}
          </div>

          ${o.description ? `
            <p class="description">${esc(o.description)}</p>
          ` : ""}
        </aside>

      </div>

    </main>
  `;
}

fetch("data/oeuvres.json",{cache:"no-store"})
  .then(response => {
    if(!response.ok) throw new Error("Données introuvables");
    return response.json();
  })
  .then(list => {

    const params = new URLSearchParams(window.location.search);
    const wanted = params.get("oeuvre");

    if(!wanted){
      renderGallery(list);
      return;
    }

    const oeuvre = list.find(o => slug(o.titre) === wanted);

    if(!oeuvre){
      app.innerHTML = `
        <div class="empty">
          Cette œuvre n'a pas été trouvée.<br><br>
          <a href="index.html" style="color:#d9b456">Retour à la galerie</a>
        </div>
      `;
      return;
    }

    document.title = `${oeuvre.titre} | Mandalaman`;
    renderDetail(oeuvre);
  })
  .catch(() => {
    app.innerHTML = `
      <div class="empty">
        Les données de la galerie n'ont pas pu être chargées.
      </div>
    `;
  });
</script>

  <div id="lightbox" class="lightbox" onclick="fermerLightbox()">
  <button class="lightbox-close" onclick="event.stopPropagation(); fermerLightbox()">×</button>
  <img id="lightbox-image" src="" alt="" onclick="event.stopPropagation(); zoomLightbox(this)">
</div>

<style>
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0,0,0,.96);
  align-items: center;
  justify-content: center;
  overflow: auto;
  padding: 30px;
}

.lightbox.open {
  display: flex;
}

.lightbox img {
  max-width: 95vw;
  max-height: 92vh;
  width: auto;
  height: auto;
  cursor: zoom-in;
  transition: transform .2s ease;
}

.lightbox img.zoomed {
  transform: scale(2);
  cursor: zoom-out;
}

.lightbox-close {
  position: fixed;
  top: 18px;
  right: 22px;
  z-index: 10000;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1px solid #c99a3c;
  background: #080806;
  color: #f0d274;
  font-size: 30px;
  cursor: pointer;
}
</style>

<script>
function ouvrirLightbox(src) {
  const box = document.getElementById("lightbox");
  const img = document.getElementById("lightbox-image");

  img.src = src;
  img.classList.remove("zoomed");
  box.classList.add("open");
}

function fermerLightbox() {
  const box = document.getElementById("lightbox");
  const img = document.getElementById("lightbox-image");

  box.classList.remove("open");
  img.classList.remove("zoomed");
}

function zoomLightbox(img) {
  img.classList.toggle("zoomed");
}

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    fermerLightbox();
  }
});
</script>

</body>
</html>
